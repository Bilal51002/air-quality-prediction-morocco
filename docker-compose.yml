services:

  # ============================================================
  # APPLICATION / PIPELINE PYTHON
  # ============================================================
  air-quality:
    build: .

    container_name: air-quality

    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./scripts:/app/scripts

    env_file:
      - .env

    command: tail -f /dev/null


  # ============================================================
  # MLFLOW
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    container_name: mlflow

    ports:
      - "5000:5000"

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000"


  # ============================================================
  # POSTGRESQL POUR AIRFLOW
  # ============================================================
  postgres:
    image: postgres:16

    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # INITIALISATION AIRFLOW
  # ============================================================
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-change-me-in-dotenv}

    volumes:
      # DAGs Airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

      # Projet Python accessible depuis Airflow
      - ./scripts:/opt/airflow/project/scripts

      # Données
      - ./data:/opt/airflow/project/data

      # Résultats
      - ./results:/opt/airflow/project/results

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Bilal \
          --lastname Khallabi \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW API SERVER / WEB INTERFACE
  # ============================================================
  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-change-me-in-dotenv}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    ports:
      - "8080:8080"

    command:
      - api-server


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-change-me-in-dotenv}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    command:
      - scheduler


  # ============================================================
  # AIRFLOW DAG PROCESSOR
  # ============================================================
  # Composant separe du scheduler depuis Airflow 3.0 : c'est lui qui
  # parse les fichiers de airflow/dags/. Sans lui, l'UI le signale en
  # rouge ("Dag Processor") et les DAGs ne sont pas (re)charges.
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-change-me-in-dotenv}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    command:
      - dag-processor


  # ============================================================
  # AIRFLOW TRIGGERER
  # ============================================================
  # Necessaire pour les taches "deferrable" (aucune ici) mais aussi
  # verifie par le healthcheck de l'UI ("Triggerer" en rouge sinon).
  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-change-me-in-dotenv}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    command:
      - triggerer


# ================================================================
# VOLUMES
# ================================================================
volumes:

  postgres-db-volume:
