services:

  # ============================================================
  # APPLICATION / PIPELINE PYTHON
  # ============================================================
  air-quality:
    build: .

    container_name: air-quality

    volumes:
      # Données persistantes
      - ./data:/app/data

      # Résultats persistants
      - ./results:/app/results

      # Scripts accessibles depuis le container
      - ./scripts:/app/scripts

    env_file:
      - .env

    command: tail -f /dev/null


  # ============================================================
  # POSTGRESQL POUR AIRFLOW
  # ============================================================
  postgres:
    image: postgres:16

    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # INITIALISATION AIRFLOW
  # ============================================================
  airflow-init:
    image: apache/airflow:3.0.6

    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    volumes:
      # DAGs Airflow
      - ./airflow/dags:/opt/airflow/dags

      # Projet Python accessible depuis Airflow
      - ./scripts:/opt/airflow/project/scripts

      # Données
      - ./data:/opt/airflow/project/data

      # Résultats
      - ./results:/opt/airflow/project/results

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Bilal \
          --lastname Khallabi \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW API SERVER / WEB INTERFACE
  # ============================================================
  airflow-api-server:
    image: apache/airflow:3.0.6

    container_name: airflow-api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    ports:
      - "8080:8080"

    command:
      - api-server


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    image: apache/airflow:3.0.6

    container_name: airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"


      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/project/scripts
      - ./data:/opt/airflow/project/data
      - ./results:/opt/airflow/project/results

    command:
      - scheduler


# ================================================================
# VOLUMES
# ================================================================
volumes:

  postgres-db-volume: